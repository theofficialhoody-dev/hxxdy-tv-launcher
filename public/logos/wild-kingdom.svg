<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" fill="none">
  <defs>
    <linearGradient id="wk-peak-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Geometric Mountain Apex -->
  <g transform="translate(10, 14)">
    <polygon points="12,2 22,22 2,22" stroke="url(#wk-peak-grad)" stroke-width="1.8" fill="none" />
    <polygon points="12,8 17,20 7,20" fill="#ffffff" fill-opacity="0.15" />
    <line x1="12" y1="2" x2="12" y2="10" stroke="#fbbf24" stroke-width="1.5" />
  </g>
  <!-- Typography -->
  <text x="44" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="#ffffff">
    WILD KINGDOM
  </text>
  <text x="44" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="8" fill="url(#gold-accent)">
    PEAKS
  </text>
  <line x1="140" y1="41" x2="235" y2="41" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8" />
</svg>
