<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <linearGradient id="qh-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <!-- Apple TV style minimal audio acoustic bar -->
  <g transform="translate(10, 18)" opacity="0.85">
    <rect x="0" y="8" width="2" height="6" fill="#38bdf8" rx="1" />
    <rect x="5" y="4" width="2" height="14" fill="#ffffff" rx="1" />
    <rect x="10" y="0" width="2" height="22" fill="#ffffff" rx="1" />
    <rect x="15" y="6" width="2" height="10" fill="#ffffff" rx="1" />
    <rect x="20" y="9" width="2" height="4" fill="#38bdf8" rx="1" />
  </g>
  <!-- Typography -->
  <text x="44" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#ffffff">
    QUIET
  </text>
  <text x="44" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="9" fill="url(#qh-gradient)">
    HOURS
  </text>
  <circle cx="168" cy="42" r="1.5" fill="#38bdf8" />
