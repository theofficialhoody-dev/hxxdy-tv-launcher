<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <linearGradient id="velo-speed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="speed-streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Speed lines -->
  <line x1="10" y1="18" x2="42" y2="18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="4" y1="26" x2="32" y2="26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  <line x1="16" y1="34" x2="38" y2="34" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <!-- Dynamic Italicized Text -->
  <text x="50" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-style="italic" font-weight="900" letter-spacing="5" fill="url(#velo-speed)">
    VELOCITY
  </text>
  <!-- Tachometer micro arc -->
  <path d="M 50 44 L 230 44" stroke="url(#speed-streak)" stroke-width="1.5" stroke-linecap="round" />
</svg>
