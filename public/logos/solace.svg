<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <linearGradient id="sol-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Futuristic Ringed Giant orbital arc -->
  <path d="M 62 38 C 76 18, 104 18, 118 38" stroke="url(#ring-glow)" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 54 41 C 74 12, 112 12, 126 41" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4" fill="none" />
  <!-- Main Title -->
  <text x="130" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="14" fill="url(#sol-silver)">
    SOLACE
  </text>
  <!-- Minimalist coordinate sub-line -->
  <line x1="45" y1="46" x2="215" y2="46" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.75" />
  <circle cx="130" cy="46" r="1.5" fill="#38bdf8" />
</svg>
